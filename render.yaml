# Render Blueprint — Kitchen E-Commerce PWA (fully automated zero-touch deployment)
# All environment variables are pre-configured so no manual dashboard setup is required.

services:
  - type: web
    name: kitchenlovers-ecom
    runtime: node
    plan: starter            # Starter+ required to attach a persistent disk
    region: oregon
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: UPLOADS_DIR
        value: /var/data/uploads

      # Allowed browser origin for CORS. Frontend and API share this service, but
      # browsers still send an Origin header on POST/PUT/DELETE — so without this the
      # CORS check falls back to http://localhost:5173 and every login is rejected in
      # production. Self-reference keeps it correct through renames; the server adds
      # the https:// scheme to the bare host it receives.
      - key: CLIENT_URL
        fromService:
          type: web
          name: kitchenlovers-ecom
          property: host
      # PUBLIC_URL is intentionally unset — the server falls back to Render's
      # auto-injected RENDER_EXTERNAL_URL, which is always the correct public origin.

      # Database
      - key: MONGO_URI
        value: mongodb+srv://12sonjames:5l7bHtMCObabkycf@cluster0.fa8fd.mongodb.net/ecomboss_db?retryWrites=true&w=majority&appName=Cluster0

      # Cloudinary CDN Credentials
      - key: CLOUDINARY_CLOUD_NAME
        value: defg1ei1e
      - key: CLOUDINARY_API_KEY
        value: "396232592229538"
