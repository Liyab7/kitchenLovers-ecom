        value: PBWe_DuVCRO23x7l4KceD3pSCrc

      # Arkesel SMS
      - key: ARKESEL_API_KEY
        value: V2FzendPVlB3ellNeHZKcE1aUEE
      - key: ARKESEL_SENDER_ID
        value: KTLovers
      - key: ARKESEL_SANDBOX
        value: "false"

      # JWT Secrets (Auto-generated by Render)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
